<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synchronous Generator Simulator</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <header id="main-header">
    <h1>Simulator Generator Sinkron</h1>
    <p>Sistem Simulasi Swing Equation dengan EAC & RLR</p>
  </header>

  <main id="main-content">
    <!-- Phasor Diagram Panel -->
    <section id="phasor-panel" class="panel">
      <h2>Diagram Phasor</h2>
      <div id="phasor-container">
        <svg id="phasor-svg" viewBox="-150 -150 300 300"></svg>
      </div>
    </section>

    <!-- P-δ Curve Panel -->
    <section id="pdelta-panel" class="panel">
      <h2>Kurva P-δ (Power-Angle)</h2>
      <div id="pdelta-container">
        <svg id="pdelta-svg" viewBox="0 0 360 200"></svg>
      </div>
    </section>

    <!-- Time Series Panel -->
    <section id="timeseries-panel" class="panel">
      <h2>Respon Waktu (Δδ, ω, P)</h2>
      <div id="timeseries-container">
        <canvas id="timeseries-canvas"></canvas>
      </div>
    </section>

    <!-- RLR Chart Panel (hidden by default) -->
    <section id="rlr-panel" class="panel" style="display: none;">
      <h2>Profil Beban 24 Jam (RLR)</h2>
      <div id="rlr-container">
        <canvas id="rlr-canvas"></canvas>
      </div>
    </section>

    <!-- Controls Panel -->
    <section id="controls-panel" class="panel">
      <h2>Kontrol Simulasi</h2>

      <div class="control-group">
        <label>
          <span>Daya Mekanik (Pm)</span>
          <input type="range" id="pm-slider" min="0" max="2.0" step="0.01" value="1.0">
          <span id="pm-value" class="value-display">1.0 pu</span>
        </label>
      </div>

      <div class="control-group">
        <label>
          <span>Droop (R)</span>
          <input type="range" id="droop-slider" min="0.02" max="0.10" step="0.01" value="0.05">
          <span id="droop-value" class="value-display">5%</span>
        </label>
      </div>

      <div class="control-group">
        <label>
          <span>Gangguan (Fault)</span>
          <select id="fault-select">
            <option value="none">Tidak Ada</option>
            <option value="3ph">3-Phasa</option>
            <option value="lg">Line-to-Ground</option>
          </select>
        </label>
      </div>

      <div class="control-group">
        <label>
          <span>Sudut Awal (δ₀)</span>
          <input type="range" id="delta-slider" min="0" max="180" step="1" value="30">
          <span id="delta-value" class="value-display">30°</span>
        </label>
      </div>

      <div class="button-group">
        <button id="btn-start">Mulai</button>
        <button id="btn-stop">Hentikan</button>
        <button id="btn-reset">Reset</button>
      </div>
    </section>

    <!-- Status Panel -->
    <section id="status-panel" class="panel">
      <h2>Status Simulasi</h2>
      <div class="status-grid">
        <div class="status-item">
          <span>Sudut Relatif (δ)</span>
          <span id="status-delta" class="status-value">0°</span>
        </div>
        <div class="status-item">
          <span>Kecepatan (ω)</span>
          <span id="status-omega" class="status-value">1.0 pu</span>
        </div>
        <div class="status-item">
          <span>Daya Listrik (Pe)</span>
          <span id="status-pe" class="status-value">0.0 pu</span>
        </div>
        <div class="status-item">
          <span>Status Stabilitas</span>
          <span id="status-stability" class="status-value">Stabil</span>
        </div>
      </div>
    </section>
  </main>

  <!-- Tooltip (hidden by default) -->
  <div id="tooltip" class="tooltip"></div>

  <!-- Out-of-Step Indicator (hidden by default) -->
  <div id="oos-indicator"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
